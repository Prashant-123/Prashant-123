<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262">
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .t{font-size:14px;font-weight:700}
  .tag{font-size:11px;fill:#c9d1d9}
  .sub{font-size:10px;fill:#8b949e}
  .path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.4s ease-out .2s forwards}
  .n{opacity:0;transform-box:fill-box;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out 3.6s infinite}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{from{transform:scale(1);opacity:1}to{transform:scale(3.2);opacity:0}}
  @keyframes blink{50%{opacity:0}}
</style>
